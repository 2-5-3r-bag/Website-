<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нэвтрэх — ZENith Beauty</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-shell">
    <div class="frame">
      <header class="topbar">
        <button class="menu-toggle" data-menu-toggle type="button" aria-label="Цэс">=</button>
        <nav class="nav-main">
          <a class="nav-home" href="index.html">Home</a>
          <a href="salbar.html">Салбар</a>
          <a href="tuhai.html">Тухай</a>
        </nav>
        <nav class="nav-auth">
          <a class="active" href="login.html" data-auth-link>Нэвтрэх</a>
        </nav>
      </header>
      <aside class="sidebar">
        <nav class="side-nav">
          <a href="brands.html">Брэнд</a>
          <a href="emegtei.html">Эмэгтэй</a>
          <a href="eregtei.html">Эрэгтэй</a>
          <a href="unertnii-torol.html">Үнэртний төрөл</a>
        </nav>
        <p class="side-copy">Өөрийн Gmail хаягаар нэвтэрнэ.</p>
        <a class="cart-link" href="sags.html">Сагс <span class="cart-count" data-cart-count>0</span></a>
      </aside>
      <main class="content">
        <h1>Gmail-ээр нэвтрэх</h1>
        <p class="auth-note">Зөвхөн @gmail.com хаяг хүлээн авна. Өгөгдөл таны хөтөч дээр хадгалагдана.</p>
        <p class="filters" style="justify-content:center">
          <button type="button" class="btn primary" data-mode-btn="login">Нэвтрэх</button>
          <button type="button" class="btn" data-mode-btn="register">Бүртгүүлэх</button>
        </p>
        <form class="form" data-login-form data-mode="login">
          <label>Gmail
            <input type="email" name="email" required placeholder="name@gmail.com">
          </label>
          <label>Нууц үг
            <input type="password" name="password" required minlength="4">
          </label>
          <button class="btn primary" type="submit">Нэвтрэх</button>
          <p class="msg" data-msg></p>
        </form>
      </main>
      <footer class="footer">ZENith Beauty · Сонгомол үнэртнүүд · Since 2016</footer>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
